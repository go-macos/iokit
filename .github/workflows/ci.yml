name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: darwin (on-device IOKit HID enumeration, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (CGO=0, real IOKit: enumerate, open, stream)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (CGO=1)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  linux:
    name: linux (stub build + OS-independent tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build stub
        run: CGO_ENABLED=0 go build ./...
      - name: Test (stub + OS-independent core)
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Race (OS-independent core)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (stub build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Build stub
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Test (stub + OS-independent core)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

      - name: Probe (list devices; a CI runner has no HID, so only the listing is asserted)
        run: CGO_ENABLED=0 go run ./cmd/hidprobe
